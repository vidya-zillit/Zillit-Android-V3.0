[versions]
# Toolchain.
# Kotlin is pinned to 2.0.21 rather than v2's 2.1.10 because Realm Kotlin 3.0.0 — the
# latest release, and the last one there will be — ships a compiler plugin built against
# Kotlin 2.0.x. On 2.1.10 it fails with NoSuchMethodError inside the FIR backend.
# This is a real constraint of keeping Realm: the DB pins the language version.
# Alternatives, if that becomes unacceptable: Realm Java 10.19 (works on 2.1.10 but
# needs kapt and is not Flow-native), or Room (actively maintained, no pin).
agp = "8.7.0"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.56.2"

# AndroidX
coreKtx = "1.15.0"
# System emoji picker for the chat composer — same widget v2 uses.
emojiPicker = "1.5.0"
# Not used directly. emoji2-emojipicker pulls kotlinx-coroutines-guava, which puts full
# guava on the runtime classpath; that evicts com.google.guava:listenablefuture to its
# empty "avoid-conflict" stub, and CameraX then fails to COMPILE because ListenableFuture
# exists nowhere on the compile classpath. Declaring guava explicitly puts it on both, and
# the -android flavour is the right one to ship (the transitive default is -jre).
guava = "33.4.0-android"
# S3 transfers. Same major line v2 ships, so the TransferUtility behaviour (multipart
# thresholds, resumable state) is the one the backend has been exercised against.
awsS3 = "2.81.1"
# Uploads must survive the process — see UploadWorker.
workManager = "2.10.0"
mapsCompose = "6.4.1"
playServicesMaps = "19.0.0"
places = "4.4.1"
hiltWork = "1.2.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
navigationCompose = "2.8.5"
splashscreen = "1.0.1"
datastore = "1.1.1"
windowManager = "1.3.0"

# Compose
composeBom = "2024.12.01"

# Networking — Ktor pinned to the version v2 ships, deliberately.
ktor = "2.3.6"
serialization = "1.7.3"
socketio = "2.1.0"

# Persistence — Realm Kotlin SDK (coroutine/Flow native), replacing v2's Realm Java.
realm = "3.0.0"

# Media / scanning
camerax = "1.5.3"
mlkitBarcode = "18.3.1"
coil = "2.7.0"
# Print support: PrintHelper handles image scaling the platform API leaves to callers.
androidxPrint = "1.0.0"

coroutines = "1.9.0"
firebaseBom = "34.9.0"
googleServices = "4.4.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-emoji-picker = { group = "androidx.emoji2", name = "emoji2-emojipicker", version.ref = "emojiPicker" }
androidx-print = { group = "androidx.print", name = "print", version.ref = "androidxPrint" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
aws-s3 = { group = "com.amazonaws", name = "aws-android-sdk-s3", version.ref = "awsS3" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
places = { group = "com.google.android.libraries.places", name = "places", version.ref = "places" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "windowManager" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
