org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx4g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Non-transitive R classes: each library's R contains only its own resources.
android.nonTransitiveRClass=true

# Jetifier is deliberately OFF. v2 had android.enableJetifier=true, which rewrites
# every dependency on every build for the sake of pre-AndroidX artifacts. Nothing
# in this project needs it, and leaving it off is a straight build-speed win.
android.enableJetifier=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
